services:
  redis:
    image: redis:7-alpine
    container_name: cache_sim_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 10mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cache_sim_backend
    ports:
      - "5000:5000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cache_sim_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
